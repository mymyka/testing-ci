name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  PYTHON_VERSION: "3.14"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# ─── PARALLEL CHECKS ────────────────────────────────────────────────────────

jobs:
  lint:
    name: "Check / Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run ruff check .
        # mock: remove this block and uncomment above when ruff is configured
        continue-on-error: false
      - run: echo "✅ Lint passed"

  format:
    name: "Check / Format"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run ruff format --check .
      - run: echo "✅ Format passed"

  typecheck:
    name: "Check / Typecheck"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run mypy . --ignore-missing-imports
      - run: echo "✅ Typecheck passed"

  unused-code:
    name: "Check / Unused Code"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run vulture . --min-confidence 80
      - run: echo "✅ No unused code found"

  spell-check:
    name: "Check / Spell Check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install codespell
      - run: codespell --skip=".git,uv.lock,*.pyc,__pycache__" .
      - run: echo "✅ Spell check passed"

  branch-name:
    name: "Check / Branch Name"
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch name
        run: |
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}"
          echo "Branch: $BRANCH"
          # Allow: main, master, dev, prod, feat/*, fix/*, chore/*, hotfix/*, release/*
          if echo "$BRANCH" | grep -qE '^(main|master|dev|prod|feat|fix|chore|hotfix|release)(/[a-z0-9._-]+)?$'; then
            echo "✅ Branch name '$BRANCH' is valid"
          else
            echo "❌ Branch name '$BRANCH' does not match allowed pattern"
            echo "   Allowed: main | master | dev | prod | feat/* | fix/* | chore/* | hotfix/* | release/*"
            exit 1
          fi

  security:
    name: "Check / Security"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run bandit -r . -x .venv,__pycache__ -ll
      - run: echo "✅ Security scan passed"

  dependency-cves:
    name: "Check / Dependency CVEs"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run pip-audit
      - run: echo "✅ No known CVEs in dependencies"

# ─── TESTING (waits for all checks) ─────────────────────────────────────────

  test:
    name: "Test"
    runs-on: ubuntu-latest
    needs:
      - lint
      - format
      - typecheck
      - unused-code
      - spell-check
      - branch-name
      - security
      - dependency-cves
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run pytest -v --tb=short
      - run: echo "✅ All tests passed"

# ─── BUILD & PUSH (dev / prod only) ──────────────────────────────────────────

  build-push:
    name: "Build & Push"
    runs-on: ubuntu-latest
    needs: [test]
    if: |
      github.ref == 'refs/heads/dev' ||
      github.ref == 'refs/heads/prod'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Determine image tag
        id: tag
        run: |
          if [ "${GITHUB_REF}" = "refs/heads/prod" ]; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "env=prod"   >> "$GITHUB_OUTPUT"
          else
            echo "tag=dev"    >> "$GITHUB_OUTPUT"
            echo "env=dev"    >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            ENV=${{ steps.tag.outputs.env }}

      - run: echo "✅ Image pushed → ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}"
