name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# ─── PARALLEL CHECKS ────────────────────────────────────────────────────────

jobs:
  lint:
    uses: ./.github/workflows/_lint.yml

  format:
    uses: ./.github/workflows/_format.yml

  typecheck:
    uses: ./.github/workflows/_typecheck.yml

  unused-code:
    uses: ./.github/workflows/_unused-code.yml

  spell-check:
    uses: ./.github/workflows/_spell-check.yml

  branch-name:
    uses: ./.github/workflows/_branch-name.yml

  security:
    uses: ./.github/workflows/_security.yml

  dependency-cves:
    uses: ./.github/workflows/_dependency-cves.yml

# ─── TESTING (waits for all checks) ─────────────────────────────────────────

  test:
    needs:
      - lint
      - format
      - typecheck
      - unused-code
      - spell-check
      - branch-name
      - security
      - dependency-cves
    uses: ./.github/workflows/_test.yml

# ─── BUILD & PUSH (dev / prod only) ──────────────────────────────────────────

  build-push:
    needs: [test]
    if: |
      github.ref == 'refs/heads/dev' ||
      github.ref == 'refs/heads/prod'
    uses: ./.github/workflows/_build-push.yml
    secrets: inherit
