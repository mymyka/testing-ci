name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# ─── PARALLEL CHECKS ────────────────────────────────────────────────────────

jobs:
  lint:
    name: "Check / Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "🔍 Running ruff check ..."
      - run: echo "✅ Lint passed"

  format:
    name: "Check / Format"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "🔍 Running ruff format --check ..."
      - run: echo "✅ Format passed"

  typecheck:
    name: "Check / Typecheck"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "🔍 Running mypy ..."
      - run: echo "✅ Typecheck passed"

  unused-code:
    name: "Check / Unused Code"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "🔍 Running vulture ..."
      - run: echo "✅ No unused code found"

  spell-check:
    name: "Check / Spell Check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "🔍 Running codespell ..."
      - run: echo "✅ Spell check passed"

  branch-name:
    name: "Check / Branch Name"
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch name
        run: |
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}"
          echo "🔍 Checking branch name: $BRANCH"
          if echo "$BRANCH" | grep -qE '^(main|master|dev|prod|feat|fix|chore|hotfix|release)(/[a-z0-9._-]+)?$'; then
            echo "✅ Branch name '$BRANCH' is valid"
          else
            echo "❌ Branch name '$BRANCH' does not match allowed pattern"
            echo "   Allowed: main | master | dev | prod | feat/* | fix/* | chore/* | hotfix/* | release/*"
            exit 1
          fi

  security:
    name: "Check / Security"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "🔍 Running bandit ..."
      - run: echo "✅ Security scan passed"

  dependency-cves:
    name: "Check / Dependency CVEs"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "🔍 Running pip-audit ..."
      - run: echo "✅ No known CVEs in dependencies"

# ─── TESTING (waits for all checks) ─────────────────────────────────────────

  test:
    name: "Test"
    runs-on: ubuntu-latest
    needs:
      - lint
      - format
      - typecheck
      - unused-code
      - spell-check
      - branch-name
      - security
      - dependency-cves
    steps:
      - uses: actions/checkout@v4
      - run: echo "🧪 Running pytest ..."
      - run: echo "✅ All tests passed"

# ─── BUILD & PUSH (dev / prod only) ──────────────────────────────────────────

  build-push:
    name: "Build & Push"
    runs-on: ubuntu-latest
    needs: [test]
    if: |
      github.ref == 'refs/heads/dev' ||
      github.ref == 'refs/heads/prod'
    steps:
      - uses: actions/checkout@v4

      - name: Determine image tag
        id: tag
        run: |
          if [ "${GITHUB_REF}" = "refs/heads/prod" ]; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "env=prod"   >> "$GITHUB_OUTPUT"
          else
            echo "tag=dev"    >> "$GITHUB_OUTPUT"
            echo "env=dev"    >> "$GITHUB_OUTPUT"
          fi

      - run: echo "🐳 Building image ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }} ..."
      - run: echo "📤 Pushing image to GHCR ..."
      - run: echo "✅ Image pushed → ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}"
