name: "🎨 Format"
description: "Run ruff format check"
runs:
  using: composite
  steps:
    - uses: actions/cache@v4
      with:
        path: ~/.cache/uv
        key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
        restore-keys: uv-${{ runner.os }}-
    - shell: bash
      run: echo "🔍 Running ruff format --check ..."
    - shell: bash
      run: echo "✅ Format passed"
