name: "🛡️ Security"
description: "Run bandit security scan"
runs:
  using: composite
  steps:
    - uses: actions/cache@v4
      with:
        path: ~/.cache/uv
        key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
        restore-keys: uv-${{ runner.os }}-
    - shell: bash
      run: echo "🔍 Running bandit ..."
    - shell: bash
      run: echo "✅ Security scan passed"
