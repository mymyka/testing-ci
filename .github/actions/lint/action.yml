name: "🧹 Lint"
description: "Run ruff linter"
runs:
  using: composite
  steps:
    - uses: actions/cache@v4
      with:
        path: ~/.cache/uv
        key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
        restore-keys: uv-${{ runner.os }}-
    - shell: bash
      run: echo "🔍 Running ruff check ..."
    - shell: bash
      run: echo "✅ Lint passed"
