name: "🧪 Test"
description: "Run pytest test suite"
runs:
  using: composite
  steps:
    - uses: actions/cache@v4
      with:
        path: ~/.cache/uv
        key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
        restore-keys: uv-${{ runner.os }}-
    - shell: bash
      run: echo "🧪 Running pytest ..."
    - shell: bash
      run: echo "✅ All tests passed"
