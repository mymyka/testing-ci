name: "📦 Dependency CVEs"
description: "Run pip-audit to check for known CVEs"
runs:
  using: composite
  steps:
    - uses: actions/cache@v4
      with:
        path: ~/.cache/uv
        key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
        restore-keys: uv-${{ runner.os }}-
    - shell: bash
      run: echo "🔍 Running pip-audit ..."
    - shell: bash
      run: echo "✅ No known CVEs in dependencies"
