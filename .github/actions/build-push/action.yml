name: "🚀 Build & Push"
description: "Build Docker image and push to GHCR"
runs:
  using: composite
  steps:
    - name: Determine image name
      id: tag
      shell: bash
      run: |
        if [ "${GITHUB_REF}" = "refs/heads/prod" ]; then
          echo "image=ghcr.io/${{ github.repository_owner }}/testing-ci-prod" >> "$GITHUB_OUTPUT"
        else
          echo "image=ghcr.io/${{ github.repository_owner }}/testing-ci-dev" >> "$GITHUB_OUTPUT"
        fi

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: .
        file: docker/Dockerfile.prod
        push: true
        tags: ${{ steps.tag.outputs.image }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
